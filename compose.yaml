x-database: &database
  DB_HOST: db
  DB_NAME: dispatcher
  DB_USER: dispatcher
  DB_PASS: ${DB_PASS}
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: dispatcher
      MARIADB_USER: dispatcher
      MARIADB_PASSWORD: ${DB_PASS:?Set DB_PASS}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 5s
      retries: 30
  migrate:
    image: dispatcher-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: web
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -ec, 'php database/release-seed.php && php database/migrate.php']
    environment:
      <<: *database
      RELEASE_ADMIN_PASSWORD: ${RELEASE_ADMIN_PASSWORD}
      RELEASE_DISPATCHER_PASSWORD: ${RELEASE_DISPATCHER_PASSWORD}
      RELEASE_ENGINEER_PASSWORD: ${RELEASE_ENGINEER_PASSWORD}
  web:
    image: dispatcher-web:local
    restart: unless-stopped
    environment:
      <<: *database
      DISPATCHER_DEMO_ROLES: ${DISPATCHER_DEMO_ROLES:-0}
      DB_MIGRATE_ON_REQUEST: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      MAIL_ENABLED: "false"
      INTAKE_API_MODE: dispatcher
      INTAKE_AI_URL: http://inference:8092/analyze
      INTAKE_AI_ALLOWED_HOSTS: inference
      INTAKE_AI_TIMEOUT_SECONDS: "20"
      INTAKE_SERVICE_TOKEN: ${DISPATCHER_API_TOKEN:?Set DISPATCHER_API_TOKEN}
      INTAKE_CONFIRM_ROLES: admin,dispatcher
      DISPATCHER_INFERENCE_URL: http://inference:8092
      STT_WHISPER_URL: http://inference:8092/transcribe
    depends_on:
      inference:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - storage:/app/storage
  inference:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: inference
    restart: unless-stopped
    environment:
      DISPATCHER_API_TOKEN: ${DISPATCHER_API_TOKEN}
      DISPATCHER_LLAMA: "1"
      DISPATCHER_KB_EDITS: /inference/knowledge-data/edits.json
      DISPATCHER_CHAT_URL: ${MODEL_HOST:-http://172.17.0.1}:11436
      DISPATCHER_EMBED_URL: ${MODEL_HOST:-http://172.17.0.1}:11437
      DISPATCHER_WHISPER_URL: ${MODEL_HOST:-http://172.17.0.1}:8090/inference
    volumes:
      - storage:/app/storage:ro
      - knowledge:/inference/knowledge-data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python3, -c, "import pathlib,socket; assert pathlib.Path('index.json').is_file(); socket.create_connection(('127.0.0.1',8092),2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 18
volumes:
  database:
  storage:
  knowledge:
