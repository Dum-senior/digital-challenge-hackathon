name: engineer-assistant-test
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: engineer_test
      MARIADB_USER: helpdesk
      MARIADB_PASSWORD: local-test-only
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - test-db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 40
  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    volumes:
      - .:/app
      - ./docker/test.env:/app/.env:ro
    ports:
      - '127.0.0.1:8085:8000'
    environment:
      ENGINEER_AI_GENERATION_ENABLED: ${ENGINEER_AI_GENERATION_ENABLED:-false}
      ENGINEER_OLLAMA_URL: ${ENGINEER_OLLAMA_URL:-http://host.docker.internal:11434}
      ENGINEER_OLLAMA_MODEL: ${ENGINEER_OLLAMA_MODEL:-qwen3:0.6b}
      STT_WHISPER_URL: ${STT_WHISPER_URL:-}
      INTAKE_AI_URL: ${INTAKE_AI_URL:-http://host.docker.internal:8091/api/hackathon/v1/intake/analyze}
      INTAKE_AI_ALLOWED_HOSTS: ${INTAKE_AI_ALLOWED_HOSTS:-host.docker.internal,intake-ai}
      INTAKE_SERVICE_TOKEN: ${INTAKE_SERVICE_TOKEN:-}
      TEST_BASE_URL: http://127.0.0.1:8000
    depends_on:
      db:
        condition: service_healthy
    command: [php, -S, '0.0.0.0:8000', -t, public, public/index.php]
volumes:
  test-db:
