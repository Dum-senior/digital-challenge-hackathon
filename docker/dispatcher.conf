<VirtualHost *:80>
    DocumentRoot /app/public
    <Directory /app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>
    <LocationMatch "^/(install|uploads)(/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
