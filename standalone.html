34px;flex:none}.muted{color:var(--muted)}.small{font-size:11px}.top-gap{margin-top:18px}.view-label{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:#9ba9bd;margin-bottom:13px}.footer-note{color:#a2afbe;font-size:11px;text-align:center;margin:32px 0 0}.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 44px))}.toast{padding:12px 16px;background:#192e4e;color:white;box-shadow:0 10px 35px #192e4e2e;border-radius:9px;font-size:12px;line-height:1.6}.toast.error{background:#9e3b3b}.toast.success{background:#1e6a52}.modal-backdrop{position:fixed;inset:0;background:#12213884;z-index:40;display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);background:white;border-radius:14px;border:1px solid #e4e9f1;box-shadow:0 18px 70px #10223b35;padding:24px}.modal h2{font-size:18px;margin:0 0 8px}.modal p{font-size:12px;color:#76869a;line-height:1.6}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{max-width:450px;width:100%;padding:29px}.login-card .brand{padding:0;margin:0 0 28px}.login-card h1{font-size:25px;letter-spacing:-.7px;margin-bottom:7px}.login-card p{font-size:13px;color:#8593a6}.login-card .button{width:100%}.login-card .notice{margin:15px 0}.role-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px}.role-tile{border:1px solid #e4eaf2;background:#fff;text-align:left;border-radius:9px;padding:13px;font-size:12px;font-weight:700;color:#45566e;line-height:1.5}.role-tile:hover{background:#f3f7ff;border-color:#bacff8}.spinner{height:15px;width:15px;border:2px solid #d0ddf9;border-top-color:var(--primary);border-radius:100%;animation:spin .75s linear infinite;display:inline-block;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;bor @media(max-width:980px){.split{grid-template-columns:1fr}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.shell{display:block}.sidebar{position:static;height:auto;padding:13px 14px 11px;border-right:0;border-bottom:1px solid var(--border)}.sidebar .brand{padding:0;margin-bottom:12px}.sidebar .nav-caption,.sidebar-footer{display:none}.sidebar nav{flex-direction:row;gap:4px;overflow-x:auto}.nav-item{width:auto;white-space:nowrap;padding:9px 11px;font-size:11px}.nav-item svg{height:16px;width:16px}.content{padding:19px 15px 35px}.topbar{margin-bottom:23px}.role-choice{max-width:146px;font-size:11px}.avatar{display:none}.intro{margin-bottom:20px}.card{padding:17px}.grid-2{gap:13px}.kb-grid{grid-template-columns:1fr}.filters input{min-width:100%}.filters select{min-width:calc(50% - 5px)}.button.push{margin-left:0}.form-actions .button{flex:1}.table-head{padding:13px 15px}.ticket-head{flex-wrap:wrap}.grid-3{grid-template-columns:1fr}.role-tiles{grid-template-columns:1fr 1fr}}

/* V2: minimal role-focused interface */
.work-focus{max-width:920px}
.ticket-title-link{display:block;text-align:left;border:0;background:transparent;color:#304159;font-weight:690;font-size:12px;padding:1px 0 5px;white-space:normal;cursor:pointer}
.ticket-title-link:hover{color:var(--primary)}
.source-line{display:flex;gap:7px;align-items:center;padding:5px 0;color:#6280ae}
.source-line .button.link{min-height:26px;white-space:normal;text-align:left;line-height:1.5}
.source-preview{background:#f5f8ff;border:1px solid #e4ebf8;border-radius:9px;padding:14px;color:#53647e;font-size:13px;line-height:1.8;max-height:310px;overflow-y:auto;white-space:normal}
.kb-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.kb-actions .button{white-space:normal}
.admin-actions{justify-content:flex-start;margin:0 0 8px}
.stats-filters{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.stats-filters .form-field{margin-bottom:0;min-width:180px;flex:1}
.stats-filters .button{min-height:43px}
.stat-line{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f5;gap:14px}
.stat-line:last-child{border:0}
input[type=date],input[type=url]{width:100%;border:1px solid #e1e7f0;border-radius:9px;background:#fbfcff;padding:11px 13px;color:#2d3e59;outline:none;min-height:43px}
input[type=date]:focus,input[type=url]:focus{border-color:#82a7f3;box-shadow:0 0 0 3px rgba(40,100,232,.08)}
.modal{max-height:calc(100vh - 44px);overflow-y:auto}
.role-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:700px){.role-tiles{grid-template-columns:1fr}.stats-filters .form-field{min-width:calc(50% - 6px)}.stats-filters .button{width:100%}.admin-actions .button{flex:1}.work-focus{max-width:100%}}

/* V3: actions live in each engineer queue row, not in a separate ticket card. */
.engineer-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:195px}
.engineer-actions .button{min-height:33px;padding:7px 10px;font-size:11px;white-space:nowrap}
.engineer-actions .button:disabled{opacity:.38;cursor:not-allowed;filter:none}
@media(max-width:700px){.engineer-actions{min-width:180px}.engineer-actions .button{flex:0 0 auto}}

/* V4 — AI case requirements: critical engineer alert, SLA, explainability, reporting */
.urgent-banner{background:linear-gradient(100deg,#fff2ef 0%,#fff9f7 100%);border:2px solid #dd5647;border-radius:12px;padding:19px 20px;display:flex;align-items:center;gap:17px;box-shadow:0 6px 20px rgba(202,61,46,.08);margin:0 0 16px;animation:urgentPanelPulse 2s ease-in-out infinite}
.urgent-banner>div:nth-child(2){min-width:0;flex:1}
.urgent-banner-icon{color:#cd332e;background:#ffe5e1;height:48px;width:48px;border-radius:12px;display:grid;place-items:center;flex:none;animation:urgentIconBlink 1s steps(2,end) infinite}
.urgent-head{font-size:16px;line-height:1.4;letter-spacing:.1px;font-weight:850;color:#b62a25;animation:urgentTextBlink 1s ease-in-out infinite}
.urgent-details{font-size:12px;line-height:1.6;margin-top:4px;color:#8c4a44}
.urgent-quick{border:1px solid #c93830;background:#c93830;color:white;font-weight:780;white-space:normal;flex:0 0 auto}
.urgent-row-caption{color:#c53129;font-size:10px;font-weight:850;margin-top:7px;display:flex;align-items:center;gap:4px;animation:urgentTextBlink 1.1s ease-in-out infinite}
.table tbody tr.urgent-ticket-row{background:#fff9f8;border-left:4px solid #dc493c}
.table tbody tr.urgent-ticket-row:hover{background:#fff3f0}
.urgent-highlight{outline:3px solid #e2513d;outline-offset:-3px}
.engineer-actions .button.urgent-accept{color:#fff;background:#c62b24;border-color:#bd241e;font-size:11px;font-weight:900;box-shadow:0 0 0 0 rgba(220,51,38,.42);animation:urgentButtonBlink 1s ease-in-out infinite}
.engineer-actions .button.urgent-accept:hover{filter:none;background:#981a17}
.sla-text{display:inline-block;margin-top:3px;font-size:11px;color:#96682e;font-weight:700;font-variant-numeric:tabular-nums}
.sla-text.overdue{color:#b82923}
.row-sla{margin-top:5px;min-height:20px}
.demo-help{margin:0 0 15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo-help .button{font-size:11px}
.extract-details{border:1px solid #e6ecf5;border-radius:9px;background:#fbfcff;padding:12px 14px;margin:14px 0}
.extract-details summary{font-weight:750;color:#3f5b85;font-size:12px;cursor:pointer;line-height:1.65;list-style-position:inside}
.extract-details .form-field{margin-bottom:11px}
.extract-details[open] summary{margin-bottom:10px}
.ai-assessment{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#f5f8ff;border:1px solid #e5ebfa;border-radius:9px;padding:12px 14px;margin:12px 0}
.progress-row{margin:12px 0 17px}
.progress-label{display:flex;justify-content:space-between;color:#4b5f7b;font-size:12px;gap:14px;margin-bottom:7px}
.progress-label strong{color:#253750;font-variant-numeric:tabular-nums}
.progress-track{height:8px;background:#ecf0f7;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:#749cec;min-width:0}
.progress-fill.low{background:#4aaf83}.progress-fill.medium{background:#7b9deb}.progress-fill.high{background:#e8a34c}.progress-fill.critical{background:#e36359}
.metric-card{display:flex;align-items:center;gap:16px;padding:14px;background:#f5f8ff;border-radius:10px;margin-top:12px;flex-wrap:wrap}
.metric-time{font-size:27px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums;color:#1e4fb5}
.metric-context{color:#657890;font-size:12px}
@keyframes urgentButtonBlink{0%,100%{background:#b82420;box-shadow:0 0 0 0 rgba(222,52,43,.34)}50%{background:#f14837;box-shadow:0 0 0 6px rgba(231,60,48,.19)}}
@keyframes urgentTextBlink{0%,100%{color:#a92420;opacity:1}50%{color:#f03529;opacity:.55}}
@keyframes urgentIconBlink{0%,100%{background:#ffe5e1;color:#b72b24}50%{background:#e54b3b;color:#fff}}
@keyframes urgentPanelPulse{0%,100%{border-color:#df594c;box-shadow:0 6px 20px rgba(202,61,46,.08)}50%{border-color:#f29a87;box-shadow:0 5px 27px rgba(220,61,44,.18)}}
@media(max-width:840px){.urgent-banner{flex-wrap:wrap}.urgent-quick{width:100%}}
@media(max-width:700px){.urgent-banner{padding:13px;gap:10px}.urgent-banner-icon{height:39px;width:39px}.urgent-head{font-size:13px}.urgent-details{font-size:11px}.engineer-actions .button.urgent-accept{white-space:normal}.ai-assessment{grid-template-columns:1fr}}

   const assigned=Array.isArray(e.tickets)?e.tickets:(Array.isArray(e.active_tickets)?e.active_tickets:(Array.isArray(e.assigned_tickets)?e.assigned_tickets:[]));
   const searchable=[e.name||'',e.department||'',...skills.map(x=>typeof x==='string'?x:(x?.name||'')),...assigned.map(t=>[t.id,t.subject||t.title||'',t.category||''].join(' '))].join(' ').toLocaleLowerCase('ru-RU');
   return !query||searchable.includes(query);
 });
 const activeStatuses=new Set(['new','open','in_progress','needs_clarification']);
 const assignedTo=e=>{
   const list=Array.isArray(e.tickets)?e.tickets:(Array.isArray(e.active_tickets)?e.active_tickets:(Array.isArray(e.assigned_tickets)?e.assigned_tickets:[]));
   return list.filter(t=>activeStatuses.has(t.status));
 };
 const activeTotal=all.reduce((sum,e)=>sum+assignedTo(e).length,0);
 const criticalTotal=all.reduce((sum,e)=>sum+assignedTo(e).filter(t=>t.priority==='critical').length,0);
 const warning=state.engineersError?`<div class="notice warning top-gap" role="alert">Не удалось получить список инженеров из API: ${esc(state.engineersError)}. Проверьте права администратора и маршрут GET /api/v1/admin/engineers.</div>`:'';

 const summary=state.engineersLoaded&&!state.engineersError?`<div class="engineer-summary"><div class="surface engineer-stat"><span>Инженеров</span><strong>${all.length}</strong></div><div class="surface engineer-stat"><span>Назначенных активных заявок</span><strong>${activeTotal}</strong></div><div class="surface engineer-stat"><span>Критических активных</span><strong>${criticalTotal}</strong></div></div>`:'';
 const search=`<div class="engineers-search"><label class="sr-only" for="engineers-search">Поиск инженера или компетенции</label><input id="engineers-search" type="search" placeholder="Поиск по инженеру, компетенции или заявке…" value="${esc(state.engineersQuery)}" /></div>`;
 const cards=matches.map(e=>{
   const skills=(Array.isArray(e.competencies)?e.competencies:(Array.isArray(e.skills)?e.skills:[])).map(x=>typeof x==='string'?x:x?.name).filter(Boolean);
   const tasks=assignedTo(e).sort((a,b)=>({critical:0,high:1,medium:2,low:3}[a.priority]??4)-({critical:0,high:1,medium:2,low:3}[b.priority]??4));
   const started=tasks.filter(t=>t.status==='in_progress').length;
   const awaiting=tasks.length-started;
   const openTable=tasks.length?`<div class="table-wrap"><table class="table engineer-task-table"><thead><tr><th>№</th><th>Заявка</th><th>Приоритет</th><th>Статус</th></tr></thead><tbody>${tasks.map(t=>`<tr><td class="primary-text">#${esc(t.id)}</td><td><strong>${esc(t.subject||t.title||'Без названия')}</strong>${t.location?`<div class="small muted">${esc(t.location)}</div>`:''}</td><td>${pillPriority(t.priority)}</td><td>${pillStatus(t.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="engineer-no-tasks">Нет активных заявок</div>';
   const declaredCount=Number(e.active_count??e.activeCount);
   const incomplete=!tasks.length&&Number.isFinite(declaredCount)&&declaredCount>0;
   return `<section class="surface engineer-card"><div class="engineer-profile"><div class="engineer-profile-meta"><div class="engineer-avatar">${esc(String(e.name||'?').trim().split(/\s+/).slice(0,2).map(x=>x.slice(0,1)).join('').toUpperCase())}</div><div><h2>${esc(e.name||'Имя не указано')}</h2><p>${esc(e.department||'Инженер технической поддержки')}</p></div></div><div class="engineer-workload"><strong>${tasks.length}</strong><span>активных заявок</span></div></div><div class="engineer-skill-row"><span class="field-label">Компетенции</span><div class="engineer-skills">${skills.length?skills.map(s=>`<span class="engineer-skill">${esc(s)}</span>`).join(''):'<span class="muted small">Компетенции не указаны в БД</span>'}</div></div><div class="engineer-loadline"><span>Ожидают принятия: <strong>${awaiting}</strong></span><span>В работе: <strong>${started}</strong></span></div><div class="engineer-task-head">Закреплённые заявки <span>${tasks.length}</span></div>${incomplete?'<div class="notice warning">API передал количество заявок, но не их список. Для просмотра необходим массив tickets.</div>':''}${openTable}</section>`;
 }).join('');
 const status=state.engineersError?'':!state.engineersLoaded?'<div class="surface card">Загружаем список инженеров…</div>':!all.length?listIsEmpty('Инженеры не найдены','В БД пока нет доступных записей об инженерах.'):!matches.length?listIsEmpty('Совпадений нет','Измените поисковый запрос.'):cards;
 return header+warning+summary+search+`<div class="engineers-list">${status}</div>`+(API.isDemo()?'<p class="hint top-gap">ДЕМО: компетенции и распределение заявок учебные. В рабочем режиме раздел получает сведения из MariaDB через защищённый API.</p>':'');
}

function permitted(r){
 if(state.role==='dispatcher')return r==='/intake'||r==='/tickets'||r.startsWith('/tickets/');
 if(state.role==='engineer')return r==='/assigned'||r.startsWith('/tickets/');
 if(state.role==='admin')return r==='/reports'||r==='/engineers'||r==='/knowledge'||r.startsWith('/knowledge/');
 return false;
}
function render(){
 const p=route();document.title='Диспетчер ИИ';
 if(p==='/login'){root.innerHTML=loginView();return;}
 root.innerHTML=shell(p);
 let html;
 if(!permitted(p))html=notAllowed();
 else if(p==='/intake')html=intakeView();
 else if(p==='/tickets'||p==='/assigned')html=ticketsView(p==='/assigned');
 else if(p.startsWith('/tickets/')){
  const ticket=state.tickets.find(t=>String(t.id)===p.split('/')[2]);
  if(ticket&&state.role==='engineer'&&String(ticket.assigneeId)!==String(user().id))html=notAllowed();
  else html=ticketView(ticket);
 }
 else if(p==='/knowledge')html=knowledgeView();
 else if(p.startsWith('/knowledge/'))html=articleView(state.articles.find(a=>String(a.id)===p.split('/')[2]));
 else if(p==='/reports')html=reportsView();
 else if(p==='/engineers')html=engineersView();
 else html=notAllowed();
 document.getElementById('view').innerHTML=html;
 // Engineer sees proposal automatically; no additional knowledge-base navigation or button.
 if(state.role==='engineer'&&p.startsWith('/tickets/')){
  const ticket=state.tickets.find(t=>String(t.id)===p.split('/')[2]);
  if(ticket&&String(ticket.assigneeId)===String(user().id)&&!state.assist[ticket.id]&&!state.assistPending[ticket.id])findSolution(ticket.id);
 }
}
function toast(text,type=''){const wrap=root.querySelector('.toast-wrap');if(!wrap)return;const el=document.createElement('div');el.className='toast '+type;el.textContent=text;wrap.appendChild(el);setTimeout(()=>el.remove(),5000);}
function setLoading(on){state.loading=on;}
function normList(v,keys=[]){if(Array.isArray(v))return v;for(const k of keys)if(Array.isArray(v?.[k]))return v[k];return [];}
async function loadData(){
 try{
  const queries=state.role==='dispatcher'?{
   tickets:API.listTickets(),users:API.listUsers(),categories:API.listCategories(),pending:API.listPending()
  }:state.role==='engineer'?{
   tickets:API.listTickets()
  }:{articles:API.listArticles(),engineers:API.listEngineersDashboard()};
  const keys=Object.keys(queries),values=await Promise.allSettled(Object.values(queries));
  const convert=(v,keys)=>normList(v,keys);
  keys.forEach((key,i)=>{
   if(values[i].status!=='fulfilled'){
    if(key==='engineers'){state.engineersLoaded=true;state.engineersError=values[i].reason.message;state.engineers=[];}
    toast('Ошибка загрузки данных: '+values[i].reason.message,'error');return;
   }
   const v=values[i].value;
   if(key==='tickets')state.tickets=convert(v,['tickets','data','items']);
   if(key==='users')state.users=convert(v,['users','data','items']);
   if(key==='pending')state.pending=convert(v,['items','requests','data']);
   if(key==='articles')state.articles=convert(v,['articles','data','items']);
   if(key==='engineers'){state.engineers=convert(v,['engineers','data','items']);state.engineersLoaded=true;state.engineersError=null;}
   if(key==='categories')state.categories=Array.isArray(v)?v:v.categories||v.types||[];
  });
  if(state.role==='engineer')state.queueSignature=JSON.stringify(state.tickets.map(t=>[t.id,t.status,t.priority,t.responseDueAt,t.response_due_at]));
 }catch(e){toast('Ошибка загрузки: '+e.message,'error');}
 render();
}

 state.submissionText=text;state.draft=null;setLoading(true);const out=root.querySelector('#analysis-result');if(out)out.innerHTML='<div class="surface card"><span class="spinner"></span> Анализируем обращение…</div>';
 try{state.draft=await API.analyze(text,state.intakeSource);render();toast('Черновик готов. Проверьте поля перед созданием.','success');}catch(e){toast('Анализ не выполнен: '+e.message,'error');render();}finally{setLoading(false);}}

 const assigneeId=value('confirm-assignee');const person=state.users.find(u=>String(u.id)===assigneeId);
 const payload={description:value('confirm-description')||state.submissionText,subject:value('confirm-subject')||state.submissionText.slice(0,80),category:value('confirm-category'),priority:value('confirm-priority'),assigneeId:assigneeId?Number(assigneeId):null,assigneeName:person?.name||'Не назначен',location:value('confirm-location'),source:state.intakeSource,extracted:{equipment:value('confirm-equipment'),object:value('confirm-object'),floor:value('confirm-floor'),room:value('confirm-room'),ip:value('confirm-ip'),serial_number:value('confirm-serial'),symptoms:value('confirm-symptoms').split(',').map(x=>x.trim()).filter(Boolean),tags:value('confirm-tags').split(',').map(x=>x.trim()).filter(Boolean)}};
 try{const response=await API.confirm(state.draft.draft_id,payload);const createdId=response.ticket_id||response.id||response.ticket?.id;let attachmentError=null;if(state.attachment&&createdId){try{await API.uploadTicketImage(createdId,state.attachment);}catch(e){attachmentError=e.message;}}state.attachment=null;if(state.pendingId){await API.markPendingProcessed(state.pendingId,response.ticket_id||response.id);state.pendingId=null;}state.draft=null;state.submissionText='';await loadData();toast(attachmentError?'Заявка создана, но изображение не загружено: '+attachmentError:'Заявка создана после подтверждения.',attachmentError?'error':'success');navigate('/tickets/'+(response.ticket_id||response.id||response.ticket?.id));}catch(e){toast('Не удалось создать заявку: '+e.message,'error');}}

async function refreshEngineerQueue(manual=false){
 if(state.role!=='engineer'||route()!=='/assigned')return;
 try{
  const v=await API.listTickets();const tickets=normList(v,['tickets','data','items']);
  const oldIds=new Set(state.tickets.filter(t=>String(t.assigneeId)===String(user().id)&&isCriticalUnaccepted(t)).map(t=>String(t.id)));
  const newlyCritical=tickets.filter(t=>String(t.assigneeId)===String(user().id)&&isCriticalUnaccepted(t)&&!oldIds.has(String(t.id)));
  const signature=JSON.stringify(tickets.map(t=>[t.id,t.status,t.priority,t.responseDueAt,t.response_due_at]));
  const changed=state.queueSignature!==signature;state.queueSignature=signature;state.tickets=tickets;
  if(changed&&(!root.querySelector('#ticket-search:focus')&&!root.querySelector('.modal-backdrop')))render();
  if(newlyCritical.length){toast('ТРЕВОГА! Новая критическая заявка №'+newlyCritical[0].id,'error');}
  else if(manual)toast('Список заявок обновлён','success');
 }catch(e){if(manual)toast('Не удалось обновить заявки: '+e.message,'error');}
}

 if(status==='in_progress'&&!['new','open'].includes(ticket.status))return toast('Эту заявку нельзя принять повторно.','error');
 if(status==='resolved'&&ticket.status!=='in_progress')return toast('Сначала примите заявку.','error');
 try{await API.updateTicket(id,{status});await loadData();navigate('/assigned');toast(status==='in_progress'?'Заявка принята':'Заявка выполнена','success');}
 catch(e){toast('Не удалось обновить статус: '+e.message,'error');}
}

 if(state.role!=='admin')return;
 modal(`<h2>Добавить сайт в базу знаний</h2><p>Укажите URL. В рабочем режиме сервер должен безопасно загрузить и проиндексировать содержимое. В DEMO сохраняется только ссылка.</p>
 <form id="website-form"><label class="form-field"><span>Адрес сайта *</span><input name="url" type="url" maxlength="2000" required placeholder="https://example.org/manual" /></label>
 <div class="form-actions end">${btn('Отмена','close-modal')}<button class="button primary" type="submit">Добавить источник</button></div></form>`);
}
async function showSource(button){
 const id=button.dataset.id,type=button.dataset.type||'kb';
 let article=['kb','article','knowledge'].includes(type)?state.articles.find(x=>String(x.id)===String(id)):null;
 if(!article&&id&&['kb','article','knowledge'].includes(type)){
  try{article=await API.getArticle(id);}catch(_e){}
 }
 const name=button.dataset.title||article?.title||'Источник';
 const content=article?(Array.isArray(article.content)?article.content.join('\n'):String(article.content||'')):'';
 modal(`<h2>${esc(name)}</h2><p>${article?esc(article.description||'Источник из базы знаний'):'Ссылка на источник рекомендации. Для открытия полного текста требуется доступ через сервер.'}</p>
 ${content?`<div class="source-preview">${esc(content).replace(/\n/g,'<br>')}</div>`:''}<div class="form-actions end">${btn('Закрыть','close-modal')}</div>`);
}
async function requestStats(form){
 if(state.role!=='admin')return;
 const fd=new FormData(form),from=String(fd.get('from')||''),to=String(fd.get('to')||'');
 if(from&&to&&from>to)return toast('Дата начала больше даты окончания.','error');
 try{const data=await API.ticketStatistics({from,to});state.stats=data;state.statsFrom=from;state.statsTo=to;render();toast('Статистика загружена','success');}
 catch(e){toast('Не удалось запросить статистику: '+e.message,'error');}
}
async function saveArticle(form){
 if(state.role!=='admin')return;
 const fd=new FormData(form),id=form.dataset.id,article={title:String(fd.get('title')||'').trim(),category:String(fd.get('category')||'').trim(),description:String(fd.get('description')||'').trim(),content:String(fd.get('content')||'').split(/\n+/).map(s=>s.trim()).filter(Boolean)};
 if(!article.title)return toast('Укажите название.','error');
 try{if(id)await API.updateArticle(id,article);else await API.createArticle(article);closeModal();await loadData();toast('База знаний обновлена','success');}
 catch(e){toast('Ошибка сохранения: '+e.message,'error');}
}
async function deleteArticle(id){
 if(state.role!=='admin'||!confirm('Удалить статью из базы знаний?'))return;
 try{await API.deleteArticle(id);await loadData();toast('Статья удалена','success');}
 catch(e){toast('Ошибка удаления: '+e.message,'error');}
}
async function importWebsite(form){
 if(state.role!=='admin')return;
 const url=String(new FormData(form).get('url')||'').trim();
 try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw Error('Нужен HTTP(S)-адрес');
   const out=await API.importWebsite(url);closeModal();await loadData();toast(API.isDemo()?'Ссылка добавлена. Содержимое сайта в DEMO не загружается.':'Задание на загрузку сайта отправлено','success');
 }catch(e){toast('Не удалось добавить источник: '+e.message,'error');}
}

function modal(content){const place=root.querySelector('#modal-root');if(place)place.innerHTML=`<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="Диалог">${content}</div></div>`;}
function closeModal(){const place=root.querySelector('#modal-root');if(place)place.innerHTML='';}
function showAddUser(){modal(`<h2>Новый сотрудник</h2><p>Добавление в учебный список или через API администратора.</p><form id="add-user-form"><label class="form-field"><span>Имя и фамилия</span><input name="name" required maxlength="100" /></label><label class="form-field"><span>Почта</span><input name="email" type="email" required /></label><label class="form-field"><span>Роль</span><select name="role">${Object.entries(roles).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><div class="form-actions end">${btn('Отмена','close-modal')}<button class="button primary" type="submit">Создать</button></div></form>`);}
async function health(){const node=root.querySelector('#health-list');if(node)node.innerHTML='<span class="spinner"></span> Проверка…';try{const result=await API.health();const items=result.services||[];node.innerHTML=`<div class="notice ${API.isDemo()?'warning':'success'}">${esc(API.isDemo()?'Демо-статусы. Настоящая инфраструктура не проверена.':result.status||'Ответ получен от сервера.')}</div>${items.map(s=>`<div class="question">${esc(s.name)}: <strong>${esc(s.status)}</strong></div>`).join('')}`;}catch(e){if(node)node.innerHTML='<div class="notice danger">'+esc(e.message)+'</div>';}}
async function transcribe(blob,filename){if(blob.size>CFG.maxAudioBytes){toast('Аудиофайл слишком большой.','error');return;}
 toast('Отправляем аудио на распознавание…');try{const result=await API.transcribe(blob,filename);const text=result.text||result.transcript||result.transcription||'';if(!text)throw Error('Сервис вернул пустую расшифровку');state.submissionText=text;state.intakeSource='voice';state.draft=null;render();toast('Речь распознана. Проверьте текст.','success');}catch(e){toast('Распознавание не выполнено: '+e.message,'error');}}
async function startVoice(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Микрофон недоступен в этом браузере/контексте.','error');return;}
 if(API.isDemo()){toast('Распознавание микрофона доступно после подключения API Вани. В демо используйте текст или примеры.');return;}
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];const rec=new MediaRecorder(stream);state.recorder=rec;state.stream=stream;
 rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());state.recorder=null;state.stream=null;transcribe(new Blob(chunks,{type:rec.mimeType}),`voice.${rec.mimeType.includes('ogg')?'ogg':'webm'}`)};rec.start();modal(`<h2>${icon('mic',21)} Идёт запись</h2><p>Говорите чётко, затем нажмите «Остановить». После этого аудио отправится в ваш локальный сервис распознавания.</p><div class="notice">${icon('wave',24)} Запись микрофона активна</div><div class="form-actions end">${btn('Остановить запись','voice-stop','button primary')}</div>`);
 }catch(e){toast('Не удалось получить доступ к микрофону: '+e.message,'error');}}
function stopVoice(){const rec=state.recorder;closeModal();if(rec&&rec.state==='recording')rec.stop();}
function attach(){
 root.addEventListener('click',async e=>{
  const target=e.target.closest('[data-action]');if(!target)return;
  const act=target.dataset.action;if(act==='close-modal'&&e.target.closest('.modal')&&e.target!==target)return;
  if(act==='example')previewText(target.dataset.example);
  else if(act==='load-pending'){const p=state.pending.find(x=>String(x.id)===target.dataset.id);if(p){state.pendingId=p.id;state.submissionText=p.description;state.draft=null;state.intakeSource=p.source||'public';render();root.querySelector('#intake-text')?.focus();}}
  else if(act==='analyze')await analyze();
  else if(act==='confirm-draft')await confirmDraft();
  else if(act==='clarify')await clarify();
  else if(act==='open-ticket')navigate('/tickets/'+target.dataset.id);
  else if(act==='back-tickets')navigate(state.role==='engineer'?'/assigned':'/tickets');
  else if(act==='focus-urgent'){const id=target.dataset.id;const row=[...root.querySelectorAll('[data-ticket-row]')].find(el=>el.dataset.ticketRow===id);row?.scrollIntoView({behavior:'smooth',block:'center'});row?.classList.add('urgent-highlight');setTimeout(()=>row?.classList.remove('urgent-highlight'),2000);}
  else if(act==='refresh-queue')await refreshEngineerQueue(true);
  else if(act==='demo-critical'&&API.isDemo()&&state.role==='engineer'){await API.demoCriticalTicket(user().id,user().name);await loadData();toast('ДЕМО: появилась критическая заявка.','success');}
  else if(act==='load-audit'&&state.role==='admin')await loadAudit();
  else if(act==='refresh-engineers'&&state.role==='admin'){try{const data=await API.listEngineersDashboard();state.engineers=normList(data,['engineers','data','items']);state.engineersLoaded=true;state.engineersError=null;render();toast('Данные инженеров обновлены','success');}catch(err){state.engineers=[];state.engineersLoaded=true;state.engineersError=err.message;render();toast('Ошибка загрузки инженеров: '+err.message,'error');}}
  else if(act==='measure-manual'||act==='measure-ai'){if(state.role==='admin'&&state.timerStarted===null){state.timerStarted=Date.now();state.timerKind=act==='measure-manual'?'manual':'ai';state.metricsOpen=true;render();}}
  else if(act==='measure-stop'&&state.role==='admin'&&state.timerStarted!==null){state.metrics[state.timerKind]={ms:Date.now()-state.timerStarted};state.timerStarted=null;state.timerKind=null;state.metricsOpen=true;render();}
  else if(act==='find-solution')await findSolution(target.dataset.id);
  else if(act==='start-ticket')await setEngineerStatus(target.dataset.id,'in_progress');
  else if(act==='finish-ticket')await setEngineerStatus(target.dataset.id,'resolved');
  else if(act==='edit-ticket')showEditTicket(target.dataset.id);
  else if(act==='view-source')await showSource(target);
  else if(act==='open-article'&&state.role==='admin')navigate('/knowledge/'+target.dataset.id);
  else if(act==='add-article')articleForm();
  else if(act==='edit-article')articleForm(target.dataset.id);
  else if(act==='delete-article')await deleteArticle(target.dataset.id);
  else if(act==='import-website')websiteForm();
  else if(act==='back-kb')navigate('/knowledge');
  else if(act==='login-demo'){if(!roles[target.dataset.role])return;state.role=target.dataset.role;state.currentUser=null;navigate(navigation[state.role][0][0]);await loadData();}
  else if(act==='voice-start')await startVoice();
  else if(act==='voice-stop')stopVoice();
  else if(act==='upload-audio')root.querySelector('#audio-file')?.click();
  else if(act==='select-image')root.querySelector('#incident-image')?.click();
  else if(act==='show-user-modal')showAddUser();
  else if(act==='close-modal')closeModal();
  else if(act==='health')await health();
  else if(act==='reset-demo'){if(confirm('Сбросить только учебные данные этого браузера?')){API.resetDemo();state.draft=null;state.assist={};await loadData();toast('Учебные данные восстановлены','success');}}
 });
 root.addEventListener('submit',async e=>{
  const f=e.target;if(!f.id)return;e.preventDefault();
  if(f.id==='public-form'||f.id==='reporter-form')await submitPublic(f);
  else if(f.id==='stats-form')await requestStats(f);
  else if(f.id==='article-form')await saveArticle(f);
  else if(f.id==='website-form')await importWebsite(f);
  else if(f.id==='edit-ticket-form'){if(state.role==='dispatcher'){const fd=new FormData(f);try{await API.updateTicket(f.dataset.id,{subject:String(fd.get('subject')||'').trim(),description:String(fd.get('description')||'').trim()});closeModal();await loadData();toast('Текст заявки сохранён','success');}catch(e){toast('Ошибка редактирования: '+e.message,'error');}}}
  else if(f.id==='note-form')await addNote(f);
  else if(f.id==='add-user-form'){const x=new FormData(f);try{await API.addUser({name:String(x.get('name')),email:String(x.get('email')),role:String(x.get('role'))});closeModal();await loadData();toast('Сотрудник добавлен','success');}catch(e){toast(e.message,'error');}}
 });
 root.addEventListener('input',e=>{
  if(e.target.id==='intake-text')state.submissionText=e.target.value;
  if(e.target.id==='ticket-search'){state.ticketQuery=e.target.value;render();root.querySelector('#ticket-search')?.focus();root.querySelector('#ticket-search')?.setSelectionRange(state.ticketQuery.length,state.ticketQuery.length);}
  if(e.target.id==='kb-search'){state.kbQuery=e.target.value;render();root.querySelector('#kb-search')?.focus();root.querySelector('#kb-search')?.setSelectionRange(state.kbQuery.length,state.kbQuery.length);}
  if(e.target.id==='engineers-search'&&state.role==='admin'){state.engineersQuery=e.target.value;render();const field=root.querySelector('#engineers-search');field?.focus();field?.setSelectionRange(state.engineersQuery.length,state.engineersQuery.length);}
 });
 root.addEventListener('change',async e=>{
  if(e.target.id==='role-select'&&API.isDemo()){if(!roles[e.target.value])return;state.role=e.target.value;state.currentUser=null;state.ticketQuery='';state.kbQuery='';state.draft=null;navigate(navigation[state.role][0][0]);await loadData();}
  if(e.target.id==='ticket-filter-status'){state.ticketStatus=e.target.value;render();}
  if(e.target.id==='ticket-filter-priority'){state.ticketPriority=e.target.value;render();}
  if(e.target.id==='manual-action-count'||e.target.id==='ai-action-count'){const key=e.target.id==='manual-action-count'?'manual':'ai';state.metricCounts[key]=e.target.value;state.metricsOpen=true;render();}
  if(e.target.id==='audio-file'&&e.target.files?.[0]){const file=e.target.files[0];await transcribe(file,file.name);}
  if(e.target.id==='incident-image'&&e.target.files?.[0]){const file=e.target.files[0];if(file.size>5*1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type))return toast('Поддерживаются PNG/JPG/WebP до 5 МБ','error');state.attachment=file;const node=root.querySelector('#attachment-label');if(node)node.textContent='Выбрано изображение: '+file.name+(API.isDemo()?' (демо: загрузка на сервер недоступна)':'');}
 });
 window.addEventListener('hashchange',render);
}
attach();
loadData();
setInterval(()=>{
 refreshCountdowns();
},1000);
setInterval(()=>{
 if(CFG.mode==='api'&&state.role==='engineer'&&route()==='/assigned'&&document.visibilityState==='visible'&&!root.querySelector('.modal-backdrop'))refreshEngineerQueue(false);
},15000);
})();

</script>
</body>
</html>
